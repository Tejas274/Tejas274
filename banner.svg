<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e2a44"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node rect { fill: #0f1a2e; stroke: #2b3a5c; stroke-width: 1.5; }
      .node text { fill: #cbd5e1; font-size: 14px; }
      .edge { fill: none; stroke: #2b3a5c; stroke-width: 2; }
      .flow { fill: none; stroke: url(#accent); stroke-width: 2; stroke-dasharray: 6 14; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- Left: identity -->
  <text x="64" y="92" class="mono" font-size="15" fill="#38bdf8">$ whoami</text>
  <text x="64" y="150" class="sans" font-size="54" font-weight="700" fill="#f8fafc">Tejas Shah</text>
  <text x="64" y="190" class="sans" font-size="20" fill="#94a3b8">Senior Data Engineer @ REBA · ex-Markerr founding team</text>
  <rect x="64" y="208" width="120" height="4" rx="2" fill="url(#accent)"/>

  <g class="mono" font-size="15">
    <text x="64" y="256" fill="#34d399">150M+</text>
    <text x="122" y="256" fill="#94a3b8">records</text>
    <text x="212" y="256" fill="#34d399">120+</text>
    <text x="259" y="256" fill="#94a3b8">pipelines</text>
    <text x="365" y="256" fill="#34d399">$400K/yr</text>
    <text x="449" y="256" fill="#94a3b8">saved</text>
  </g>
  <text x="64" y="292" class="mono" font-size="14" fill="#64748b"># did it twice? automate it. focus on what matters.</text>

  <!-- Right: a little DAG -->
  <g class="mono">
    <!-- edges (static) -->
    <path class="edge" d="M790 110 C830 110, 830 170, 870 170"/>
    <path class="edge" d="M790 230 C830 230, 830 170, 870 170"/>
    <path class="edge" d="M980 170 L1020 170"/>
    <path class="edge" d="M1080 196 L1080 236"/>
    <!-- edges (animated flow) -->
    <path class="flow" d="M790 110 C830 110, 830 170, 870 170">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path class="flow" d="M790 230 C830 230, 830 170, 870 170">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path class="flow" d="M980 170 L1020 170">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path class="flow" d="M1080 196 L1080 236">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- nodes -->
    <g class="node"><rect x="680" y="88" width="110" height="44" rx="10"/><text x="735" y="115" text-anchor="middle">extract</text></g>
    <g class="node"><rect x="680" y="208" width="110" height="44" rx="10"/><text x="735" y="235" text-anchor="middle">ingest</text></g>
    <g class="node"><rect x="870" y="148" width="110" height="44" rx="10"/><text x="925" y="175" text-anchor="middle">transform</text></g>
    <g class="node"><rect x="1020" y="144" width="120" height="52" rx="10" style="stroke:#34d399"/><text x="1080" y="175" text-anchor="middle">validate</text></g>
    <g class="node"><rect x="1020" y="236" width="120" height="44" rx="10"/><text x="1080" y="263" text-anchor="middle">warehouse</text></g>

    <!-- status dots -->
    <circle cx="694" cy="100" r="4" fill="#34d399"/>
    <circle cx="694" cy="220" r="4" fill="#34d399"/>
    <circle cx="884" cy="160" r="4" fill="#34d399"/>
    <circle cx="1034" cy="156" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1034" cy="248" r="4" fill="#475569"/>

    <text x="680" y="60" font-size="13" fill="#64748b">dag: daily_market_refresh  ·  status: running</text>
  </g>
</svg>
